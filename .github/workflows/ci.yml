name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NX_DAEMON: "false"

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Install TypeScript dependencies
        shell: bash
        run: pnpm -C runtime/typescript install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('nx.json') }}
      - name: Build and test
        shell: bash
        run: ./nx run-many -t build test

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build native encoders
        shell: bash
        run: ./nx run native:native-build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Test with native encoders
        shell: bash
        env:
          SLOOM_NATIVE_PATH: ${{ github.workspace }}/.build/native/host-release/sloom_native.so
        run: dotnet test tests/SpriteLoom.Integration.Tests/SpriteLoom.Integration.Tests.csproj -c Release
